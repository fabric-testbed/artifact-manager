# Active compose file. Copied from compose/docker-compose.yml.prod-ssl.
# Variants live in compose/ - copy one over this file to switch deployment shape.
# - Django + PostgreSQL + Nginx + Vouch Proxy, all on the amgr-network bridge
# - only Nginx publishes ports to the host
#
# Everything that varies between deployments is read from .env (see env.template):
# published ports, host bind-mount paths, TLS certificate filenames, upload size.
# A deployment should differ from this file only in its .env - do not hand-edit
# paths or ports here, or the next `git pull` will silently revert them.

services:

  django:
    # default port 8000
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: amgr-django
    networks:
      - amgr-network
#    ports:
#      - "8000:8000"
    depends_on:
      - database
    volumes:
      - ./:/code
      # Artifact bundles and database backups live outside the checkout in production.
      - ${HOST_ARTIFACT_STORAGE:-./artifact_storage}:/code/artifact_storage
      - ${HOST_ARTIFACT_BACKUPS:-./backups}:/code/backups
#      - ./static:/code/static
#      - ./media:/code/media
    environment:
      - UWSGI_UID=${UWSGI_UID}
      - UWSGI_GID=${UWSGI_GID}
      - LOAD_FIXTURES=${LOAD_FIXTURES:-0}
      - MAKE_MIGRATIONS=${MAKE_MIGRATIONS:-0}
    restart: unless-stopped

  database:
    # default port 5432
    image: postgres:18
    container_name: amgr-database
    networks:
      - amgr-network
#    ports:
#      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    volumes:
      - ${HOST_DB_DATA:-./db_data}:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    # container ports 80, 443 - published as NGINX_HTTP_PORT / NGINX_HTTPS_PORT
    image: nginx:1
    container_name: amgr-nginx
    networks:
      - amgr-network
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - .:/code
      # Read-only: Nginx only ever sends these bytes for X-Accel-Redirect downloads,
      # Django owns every write.
      - ${HOST_ARTIFACT_STORAGE:-./artifact_storage}:/code/artifact_storage:ro
      - ${NGINX_DEFAULT_CONF_TEMPLATE:-./nginx/default.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ${NGINX_NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${NGINX_SSL_CERTS_DIR:-./ssl}:/etc/ssl:ro
    environment:
      # Restrict envsubst to our own ^AMGR_ names so Nginx's runtime variables
      # ($host, $request_uri, ...) survive template rendering untouched.
      - NGINX_ENVSUBST_FILTER=^AMGR_
      - AMGR_HTTPS_PORT=${AMGR_HTTPS_PORT:-8443}
      - AMGR_SSL_CERT=${AMGR_SSL_CERT:-fullchain.pem}
      - AMGR_SSL_CERT_KEY=${AMGR_SSL_CERT_KEY:-privkey.pem}
      - AMGR_CLIENT_MAX_BODY_SIZE=${AMGR_CLIENT_MAX_BODY_SIZE:-75M}
      - AMGR_X_ACCEL_LOCATION=${AMGR_X_ACCEL_LOCATION:-/protected_artifacts/}
      - AMGR_ARTIFACT_STORAGE_PATH=${AMGR_ARTIFACT_STORAGE_PATH:-/code/artifact_storage}
    restart: unless-stopped

  vouch-proxy:
    # default port 9090
    container_name: amgr-vouch-proxy
    image: fabrictestbed/vouch-proxy:0.27.1
    networks:
      - amgr-network
#    ports:
#      - "127.0.0.1:9090:9090"
    volumes:
      - ./vouch:/config
    restart: unless-stopped

networks:
  amgr-network:
    name: amgr-network
    driver: bridge

[project]
name = "artifact-manager"
version = "1.11.1"
description = "FABRIC Artifact Manager — a Django platform for sharing and reproducing FABRIC research artifacts"
requires-python = ">=3.13"
dependencies = [
    "cryptography",
    "django~=6.0",
    "django-bootstrap5",
    "django-cors-headers",
    "django-filter",
    "djangorestframework",
    "drf-spectacular",
    "fontawesomefree",
    "markdown",
    "psycopg2-binary",
    "pyjwt>=2.15.0",
    "python-dateutil",
    "requests",
    "urllib3>=2.8.0",  # transitive via requests; floor pins CVE fixes
    "uwsgi",
]

[project]
name = "artifact-manager"
version = "1.16.5"
description = "FABRIC Artifact Manager — a Django platform for sharing and reproducing FABRIC research artifacts"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.18",  # transitive via requests; GHSA-6q48-6c7w-9gw2 (emSign root)
    "cryptography",
    "django~=6.0.10",  # 6.0.10: CVE-2026-108147 (multipart base64 memory), -113593 (Vary); 6.0.9: CVE-2026-84429, -87975, -77050
    "django-bootstrap5",
    "django-cors-headers",
    "django-filter",
    "djangorestframework>=3.18.2",  # CVE-2026-114136, -114137, -114138
    "drf-spectacular",
    "fontawesomefree",
    "markdown",
    "psycopg2-binary",
    "pyjwt>=2.15.0",
    "python-dateutil",
    "requests",
    "urllib3>=2.8.0",  # transitive via requests; floor pins CVE fixes
    "uwsgi",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-django",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--no-migrations"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
